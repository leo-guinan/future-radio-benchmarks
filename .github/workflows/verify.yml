name: Verify benchmark evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.0
      - run: python -m unittest discover -s tests -v
      - run: python tools/benchmark.py verify-baseline
      - run: python tools/benchmark.py costs
